<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Escaperoom</title>
<style>
  :root { --bg:#14111f; --card:#201b33; --text:#f3efff; --muted:#a79fc4; --t1:#ff6b6b; --t2:#4dabf7; --ok:#51cf66; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
  .screen { display:none; width:min(92vw,460px); text-align:center; padding:16px; }
  .screen.active { display:block; }
  h1 { margin:0 0 8px; font-size:2rem; }
  p { color:var(--muted); }
  .bar { height:12px; background:var(--card); border-radius:99px; overflow:hidden; margin-top:24px; }
  .bar > div { height:100%; width:0; background:linear-gradient(90deg,var(--t1),var(--t2)); transition:width .2s; }
  .btns { display:flex; gap:16px; margin-top:28px; }
  button { flex:1; padding:22px 12px; font-size:1.2rem; font-weight:700; color:#fff; border:0; border-radius:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .b1 { background:var(--t1); } .b2 { background:var(--t2); }
  .status { margin-top:20px; min-height:1.4em; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-top:20px; }
  input { width:100%; padding:14px; font-size:1.1rem; border-radius:10px; border:2px solid #3a3358; background:var(--bg); color:var(--text); margin:10px 0; }
  .ok { color:var(--ok); font-weight:700; }
  .players { display:flex; gap:12px; margin-top:20px; }
  .player { flex:1; background:var(--card); border-radius:14px; padding:16px; }
  .player small { color:var(--muted); display:block; }
  .player b { font-size:1.2rem; word-break:break-word; }
  .opts { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }
  .opts button { flex:1 1 40%; background:#3a3358; padding:18px 10px; }
  .opts button.right { background:var(--ok); }
  .opts button.wrong { background:var(--t1); }
  .sentence { font-size:1.6rem; margin:24px 0 8px; line-height:1.4; }
  .blank { display:inline-block; min-width:70px; border-bottom:3px solid var(--t2); color:var(--ok); }
  .hint { color:var(--muted); min-height:1.4em; }
  .score { font-size:3rem; font-weight:800; margin:16px 0; }
</style>
</head>
<body>

<section id="loading" class="screen active">
  <h1>English Escaperoom</h1>
  <p>Loading...</p>
  <div class="bar"><div id="fill"></div></div>
</section>

<section id="menu" class="screen">
  <h1>Choose your team</h1>
  <p>Team 1 and Team 2 each press their own button to link up.</p>
  <div class="btns">
    <button class="b1" id="pick1">Team 1</button>
    <button class="b2" id="pick2">Team 2</button>
  </div>
  <div class="status" id="menuStatus"></div>
</section>

<section id="lobby" class="screen">
  <h1 id="lobbyTitle"></h1>
  <div class="status" id="lobbyStatus"></div>
  <div class="card" id="nameCard" style="display:none">
    <label for="nameInput">Fill in your team name</label>
    <input id="nameInput" maxlength="24" placeholder="Team name" autocomplete="off">
    <button class="b1" id="saveName" style="width:100%;padding:14px;background:var(--ok)">Save</button>
  </div>
  <div class="players" id="players" style="display:none">
    <div class="player"><small>Team 1</small><b id="n1">...</b><small id="s1"></small></div>
    <div class="player"><small>Team 2</small><b id="n2">...</b><small id="s2"></small></div>
  </div>
  <button class="b1" id="startQuiz" style="display:none;margin-top:20px;width:100%;padding:18px;background:var(--ok)">Start questions</button>
  <button id="leave" style="margin-top:24px;padding:12px 20px;font-size:1rem;background:#3a3358">Leave team</button>
</section>

<section id="quiz" class="screen">
  <p id="qProgress"></p>
  <div class="sentence" id="qSentence"></div>
  <div class="hint" id="qHint"></div>
  <div class="opts" id="qOpts"></div>
  <p>Points: <b id="qPoints">0</b></p>
</section>

<section id="done" class="screen">
  <h1>Well done!</h1>
  <div class="score" id="finalScore"></div>
  <p>Keep these points, you need them later.</p>
  <button class="b1" id="backLobby" style="width:100%;padding:16px;background:#3a3358">Back</button>
</section>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); };

// Team 1's id changes every 5 minutes, so a stuck/stale claim resets by itself.
const slot = () => Math.floor(Date.now() / 300000);
const team1Id = (s, i) => 'english-escaperoom-team1-' + s + '-' + i;
const TRIES = 5; // if one id is stuck, Team 1 takes the next one and Team 2 tries all of them
let tries = 0;

// Loading screen
let pct = 0;
const timer = setInterval(() => {
  pct = Math.min(100, pct + 4 + Math.random() * 8);
  $('fill').style.width = pct + '%';
  if (pct >= 100) { clearInterval(timer); setTimeout(() => show('menu'), 300); }
}, 120);

// Team selection + linking
let me, other, peer, conn, retry;
const names = { 1: '', 2: '' };
const scores = { 1: null, 2: null };

$('pick1').onclick = () => start(1);
$('pick2').onclick = () => start(2);

function start(team) {
  me = team; other = team === 1 ? 2 : 1;
  $('pick1').disabled = $('pick2').disabled = true;
  $('menuStatus').textContent = 'Connecting...';
  if (typeof Peer === 'undefined') { $('menuStatus').textContent = 'Could not load the connection library. Check your internet.'; $('pick1').disabled = $('pick2').disabled = false; return; }
  openPeer();
  // Reset every 5 minutes: Team 1 gets a fresh id when the time window changes (unless already linked).
  if (me === 1) slotTimer = setInterval(() => { if (!(conn && conn.open) && slot() !== currentSlot) openPeer(); }, 5000);
}
let slotTimer;
window.addEventListener('beforeunload', () => peer && peer.destroy());

function leave() {
  clearTimeout(retry); clearInterval(slotTimer);
  if (conn) conn.close();
  if (peer) peer.destroy();
  peer = conn = null; me = other = null;
  names[1] = names[2] = ''; scores[1] = scores[2] = null;
  $('startQuiz').style.display = 'none';
  $('nameInput').value = '';
  $('nameCard').style.display = 'none';
  $('players').style.display = 'none';
  render();
  $('menuStatus').textContent = '';
  $('pick1').disabled = $('pick2').disabled = false;
  show('menu');
}
$('leave').onclick = leave;

let currentSlot;
function openPeer() {
  clearTimeout(retry);
  if (peer) peer.destroy();
  if (slot() !== currentSlot) tries = 0;
  currentSlot = slot();
  // Team 1 uses an id of the current 5 minute window; Team 2 uses a random id.
  peer = me === 1 ? new Peer(team1Id(currentSlot, tries)) : new Peer();
  peer.on('error', err => {
    if (err.type === 'unavailable-id') {
      // Stale id on the server: take the next one.
      tries = (tries + 1) % TRIES;
      $('menuStatus').textContent = 'Team 1 is still busy, trying again...';
      retry = setTimeout(openPeer, 800);
    } else if (err.type === 'peer-unavailable') {
      // other team has not pressed yet: keep trying
    } else {
      $('menuStatus').textContent = 'Connection problem: ' + err.type;
      retry = setTimeout(openPeer, 3000);
    }
  });
  peer.on('open', () => {
    show('lobby');
    $('lobbyTitle').textContent = `You are Team ${me}`;
    $('lobbyStatus').textContent = `Waiting for Team ${other} to press their button...`;
    peer.on('connection', c => setupConn(c));
    if (me === 2) tryConnect();
  });
}

function tryConnect() {
  if (conn && conn.open) return;
  for (let i = 0; i < TRIES; i++) setupConn(peer.connect(team1Id(slot(), i), { reliable: true }));
  retry = setTimeout(tryConnect, 2500);
}

function setupConn(c) {
  if (conn && conn.open) { c.close(); return; }
  c.on('open', () => {
    conn = c; clearTimeout(retry);
    $('lobbyStatus').innerHTML = '<span class="ok">Linked!</span> Fill in your team name.';
    $('nameCard').style.display = 'block';
    $('players').style.display = 'flex';
    if (names[me]) c.send({ team: me, name: names[me] });
    if (scores[me] !== null) c.send({ team: me, score: scores[me] });
  });
  c.on('data', d => {
    if (d.name !== undefined) names[d.team] = d.name;
    if (d.score !== undefined) scores[d.team] = d.score;
    render();
  });
  c.on('close', () => {
    conn = null;
    $('lobbyStatus').textContent = `Team ${other} left. Waiting for them to come back...`;
    if (me === 2) tryConnect();
  });
}

$('saveName').onclick = () => {
  const name = $('nameInput').value.trim();
  if (!name) return;
  names[me] = name;
  if (conn && conn.open) conn.send({ team: me, name });
  $('startQuiz').style.display = 'block';
  render();
};

function render() {
  $('n1').textContent = names[1] || '...';
  $('n2').textContent = names[2] || '...';
  $('s1').textContent = scores[1] === null ? '' : scores[1] + ' / 10 points';
  $('s2').textContent = scores[2] === null ? '' : scores[2] + ' / 10 points';
}

// ---- Questions ----
const QUESTIONS = {
  1: { options: ['this', 'that', 'these', 'those'], items: [
    ['___ is my book.', 'The book is in my hand. (one, near)', 'this'],
    ['___ are your shoes over there.', 'The shoes are far away. (many, far)', 'those'],
    ['___ cat on the roof is black.', 'The cat is far away. (one, far)', 'that'],
    ['___ pencils are new.', 'The pencils are next to me. (many, near)', 'these'],
    ['___ is a nice apple.', 'I am holding the apple. (one, near)', 'this'],
    ['Look at ___ birds in the sky!', 'The birds are far away. (many, far)', 'those'],
    ['___ chairs next to me are comfortable.', 'The chairs are close to me. (many, near)', 'these'],
    ['___ house across the street is big.', 'The house is far away. (one, far)', 'that'],
    ['Can you give me ___ pen?', 'The pen is on my desk, next to me. (one, near)', 'this'],
    ['Who are ___ children over there?', 'The children are far away. (many, far)', 'those'],
  ]},
  2: { options: ['a', 'an'], items: [
    ['I eat ___ apple every day.', '', 'an'],
    ['He has ___ dog.', '', 'a'],
    ['She sees ___ elephant at the zoo.', '', 'an'],
    ['This is ___ yellow banana.', '', 'a'],
    ['I need ___ umbrella today.', '', 'an'],
    ['We have ___ egg for breakfast.', '', 'an'],
    ['Look, ___ big house!', '', 'a'],
    ['He wants ___ ice cream.', '', 'an'],
    ['My sister has ___ orange bag.', '', 'an'],
    ['There is ___ cat on the table.', '', 'a'],
  ]},
};

let qi = 0, points = 0, locked = false;

$('startQuiz').onclick = () => { qi = 0; points = 0; show('quiz'); showQuestion(); };
$('backLobby').onclick = () => show('lobby');

function showQuestion() {
  locked = false;
  const set = QUESTIONS[me], [sentence, hint] = set.items[qi];
  $('qProgress').textContent = `Question ${qi + 1} / ${set.items.length}`;
  $('qSentence').innerHTML = sentence.replace('___', '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  $('qHint').textContent = hint;
  $('qPoints').textContent = points;
  $('qOpts').innerHTML = '';
  set.options.forEach(o => {
    const b = document.createElement('button');
    b.textContent = o;
    b.onclick = () => answer(b, o);
    $('qOpts').appendChild(b);
  });
}

function answer(btn, choice) {
  if (locked) return;
  locked = true;
  const set = QUESTIONS[me], right = set.items[qi][2];
  if (choice === right) { points++; btn.classList.add('right'); }
  else {
    btn.classList.add('wrong');
    [...$('qOpts').children].forEach(b => { if (b.textContent === right) b.classList.add('right'); });
  }
  $('qPoints').textContent = points;
  setTimeout(() => {
    qi++;
    if (qi < set.items.length) return showQuestion();
    finishQuiz();
  }, 1200);
}

function finishQuiz() {
  scores[me] = points;
  try { localStorage.setItem('escaperoom-points-team' + me, points); } catch (e) {}
  if (conn && conn.open) conn.send({ team: me, score: points });
  $('finalScore').textContent = points + ' / 10';
  render();
  show('done');
}
</script>
</body>
</html>
